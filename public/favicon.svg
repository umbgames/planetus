<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Core Sphere -->
    <radialGradient id="planetGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Atmosphere Rim Lighting -->
    <radialGradient id="rimGlow" cx="35%" cy="30%" r="70%">
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="92%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </radialGradient>

    <!-- Planetary Ring Radiant Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Space Rounded Canvas -->
  <rect width="64" height="64" rx="16" fill="#050814"/>
  <circle cx="32" cy="32" r="26" fill="url(#bgGlow)"/>

  <!-- Back Half of Ring -->
  <g transform="rotate(-26 32 32)">
    <ellipse cx="32" cy="32" rx="23" ry="7" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" opacity="0.35"/>
  </g>

  <!-- Planet Body -->
  <circle cx="32" cy="32" r="15" fill="url(#planetGrad)"/>
  <circle cx="32" cy="32" r="15" fill="url(#rimGlow)"/>

  <!-- Front Half of Ring (Clipping overlay for depth) -->
  <g transform="rotate(-26 32 32)">
    <path d="M 9 32 A 23 7 0 0 0 55 32" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
    <path d="M 16 33.5 A 23 7 0 0 0 48 33.5" stroke="#ffffff" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <!-- Distant Orbital Diamond / Star Accent -->
  <circle cx="49" cy="18" r="1.75" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="49" cy="18" r="0.9" fill="#ffffff"/>
  <path d="M 49 14.5 L 49 21.5 M 45.5 18 L 52.5 18" stroke="#38bdf8" stroke-width="0.75" stroke-linecap="round" opacity="0.8"/>
</svg>
